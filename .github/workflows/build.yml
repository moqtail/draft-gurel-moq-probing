name: "Build Draft"

on:
  push:
    paths-ignore:
    - README.md
    - CONTRIBUTING.md
    - LICENSE.md
    - .gitignore
  pull_request:
    paths-ignore:
    - README.md
    - CONTRIBUTING.md
    - LICENSE.md
    - .gitignore

jobs:
  build:
    name: "Build Draft"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: "Checkout"
      uses: actions/checkout@v4

    - name: "Setup"
      id: setup
      run: date -u "+date=%FT%T" >>"$GITHUB_OUTPUT"

    - name: "Caching"
      uses: actions/cache@v4
      with:
        path: |
          .refcache
          .venv
          .gems
          node_modules
          .targets.mk
        key: i-d-${{ steps.setup.outputs.date }}
        restore-keys: i-d-

    - name: "Build Drafts"
      uses: martinthomson/i-d-template@v1
      with:
        token: ${{ github.token }}

    - name: "Render PDF"
      run: |
        for f in draft-*.html; do
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --no-pdf-header-footer \
            --print-to-pdf="$PWD/${f%.html}.pdf" "file://$PWD/$f"
        done

    - name: "Archive Built Drafts"
      uses: actions/upload-artifact@v4
      with:
        name: draft
        path: |
          draft-*.html
          draft-*.txt
          draft-*.pdf
